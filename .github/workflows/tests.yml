name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ChatBotSteam/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r ChatBotSteam/requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q ChatBotSteam
      - name: Run offline tests
        run: python -m pytest -q
